[project]
name = "assignment-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "weaviate-client>=4.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that need a running Weaviate",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
